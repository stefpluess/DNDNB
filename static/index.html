<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Initiative Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">Initiative Ledger</div>
  <nav class="views" aria-label="Views">
    <button data-view="combat" class="on">Combat</button>
    <button data-view="party">Party</button>
    <button data-view="bestiary">Bestiary</button>
    <button data-view="wiki">Wiki</button>
  </nav>
  <div class="dbstatus" id="dbStatus"></div>
</header>

<!-- ============ COMBAT ============ -->
<div id="view-combat" class="combat">
  <aside class="library panel-col">
    <div class="tabs" id="libTabs" role="tablist">
      <button data-lib="monster" class="on">Monsters</button>
      <button data-lib="spell">Spells</button>
      <button data-lib="item">Items</button>
      <button data-lib="party">Party</button>
      <button data-lib="saved" title="Prepared encounters">Fights</button>
    </div>
    <input class="field search" id="libSearch" type="search" placeholder="Search monsters" autocomplete="off">
    <div class="libopts" id="libOpts">
      <label>Add <input class="field tiny" id="libQty" type="number" min="1" max="20" value="1"></label>
      <label><input type="checkbox" id="libRollHp"> Roll HP</label>
    </div>
    <label class="libopts surprise" title="2024: surprised creatures roll Initiative with Disadvantage"><input type="checkbox" id="libSurprised"> Surprised (Initiative with Disadvantage)</label>
    <ul class="results" id="libResults"></ul>
  </aside>

  <section class="tracker">
    <div class="turnbar">
      <div class="round"><small>Round</small><b id="round">–</b></div>
      <div class="now"><h1 id="turnName">Combat not started</h1><p id="onDeck"></p></div>
      <button class="btn" id="prevBtn" title="Previous turn (P)">Back</button>
      <button class="btn primary" id="nextBtn" title="Next turn (N)">Start combat</button>
    </div>
    <p class="diffline" id="diffLine" hidden></p>
    <div class="prompts" id="prompts" hidden></div>
    <div class="groupbar" id="groupBar" hidden></div>
    <div class="list" id="list"></div>
    <details class="quickadd">
      <summary>Add a custom combatant</summary>
      <form id="addForm" class="addgrid" autocomplete="off">
        <label class="w2">Name<input class="field" id="a-name" required placeholder="Bandit captain"></label>
        <label>Count<input class="field" id="a-count" type="number" min="1" max="20" value="1"></label>
        <label>Side<select class="field" id="a-kind"><option value="foe">Foe</option><option value="ally">Ally</option><option value="pc">PC</option></select></label>
        <label>Init<input class="field" id="a-init" type="number" placeholder="roll"></label>
        <label>Init mod<input class="field" id="a-mod" type="number" value="0"></label>
        <label>HP<input class="field" id="a-hp" placeholder="65 or 10d8+20" required></label>
        <label>AC<input class="field" id="a-ac" type="number" value="12"></label>
        <label>XP<input class="field" id="a-xp" type="number" min="0" placeholder="0"></label>
        <button class="btn primary" type="submit">Add</button>
      </form>
    </details>
    <div class="tools">
      <button class="btn sm" id="undoBtn" disabled title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn sm" id="redoBtn" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button class="btn sm" id="pickFoes" title="Tick every standing foe as a target for area damage">Target all foes</button>
      <button class="btn sm" id="endBtn" hidden>End combat</button>
      <button class="btn sm" id="clearFoes">Remove foes</button>
      <button class="btn sm bad" id="clearAll">Clear tracker</button>
      <span class="spacer"></span>
      <label><input type="checkbox" id="skipDown"> Skip defeated foes</label>
      <span class="keys"><kbd>N</kbd> next · <kbd>P</kbd> back · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
    </div>
  </section>

  <aside class="inspector panel-col">
    <div class="inspect" id="inspect"></div>
    <div class="logbox">
      <div class="loghead"><h3>Rolls</h3><button class="link" id="clearLog">Clear</button></div>
      <ol class="log" id="log"></ol>
      <form id="rollForm" class="rollform" autocomplete="off">
        <input class="field" id="rollExpr" placeholder="1d20+5, 8d6, 2d6+1d8+3" aria-label="Dice to roll">
        <button class="btn">Roll</button>
      </form>
    </div>
  </aside>
</div>

<!-- ============ PARTY ============ -->
<div id="view-party" class="party" hidden>
  <aside class="charlist panel-col">
    <button class="btn primary" id="newChar">New character</button>
    <ul id="charList"></ul>
  </aside>
  <section class="sheet" id="sheet"></section>
  <aside class="derived panel-col" id="derived"></aside>
</div>

<!-- ============ BESTIARY ============ -->
<div id="view-bestiary" class="bestiary" hidden>
  <aside class="charlist panel-col">
    <button class="btn primary" id="newMon">New creature</button>
    <div class="itemsearch">
      <input class="field search" type="search" id="copySearch" placeholder="Copy an SRD monster…" autocomplete="off">
      <ul class="results" id="copyResults" hidden></ul>
    </div>
    <ul id="monList"></ul>
  </aside>
  <section class="sheet" id="monEditor"></section>
  <aside class="derived panel-col" id="monPreview"></aside>
</div>

<!-- ============ WIKI ============ -->
<div id="view-wiki" class="wiki" hidden>
  <aside class="charlist panel-col wikinav">
    <button class="btn primary" id="newPage">New page</button>
    <input class="field search" type="search" id="wikiSearch" placeholder="Search the wiki  ( / )" autocomplete="off" aria-label="Search the wiki">
    <nav class="wikicats" id="wikiCats" aria-label="Categories"></nav>
    <ul id="wikiList"></ul>
    <button class="link wikitrash" id="wikiTrash">Trash</button>
  </aside>
  <section class="sheet wikipage" id="wikiPage"></section>
  <aside class="derived panel-col" id="wikiSide"></aside>
</div>

<dialog id="summaryDlg" class="summary" aria-labelledby="summaryTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
